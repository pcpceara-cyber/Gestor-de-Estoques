  :root {
    --roxo: #49064b; --roxo-esc: #33023a; --roxo-med: #6a2a6d; --roxo-claro: #f6eef6; --roxo-borda: #e4d3e5;
    --bg: #faf6fa; --card: #fff; --txt: #2a1230; --sub: #6e5874;
    --ok: #2f7d3a; --erro: #c62839; --aviso: #8a5a00;
    --raio: 16px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--txt); font-size: 17px; -webkit-tap-highlight-color: transparent; }
  header { background: var(--roxo); color: #fff; padding: 10px 16px 12px; }
  .topo { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .topo img { height: 64px; width: auto; display: block; }
  .topo .titulo { flex: 1; min-width: 0; }
  .topo h1 { font-family: "Caveat Brush", "Nunito", system-ui, sans-serif; font-weight: 400; font-size: 26px;
             margin: 0; line-height: 1; letter-spacing: .01em; }
  #conexao { display: inline-block; margin-top: 6px; font-size: 12px; font-weight: 700;
             background: rgba(255,255,255,.14); border-radius: 999px; padding: 3px 10px; }
  nav { display: flex; background: var(--roxo-esc); position: sticky; top: 0; z-index: 5;
        padding: 0 8px; overflow-x: auto; }
  nav button { flex: 1; border: 0; background: none; padding: 13px 6px; font: inherit; font-size: 15px;
               font-weight: 700; color: rgba(255,255,255,.65); border-bottom: 3px solid transparent;
               cursor: pointer; white-space: nowrap; }
  nav button.ativo { color: #fff; border-bottom-color: #fff; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  section[hidden] { display: none; }
  .card { background: var(--card); border: 1px solid var(--roxo-borda); border-radius: var(--raio);
          padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 10px rgba(73,6,75,.06); }
  h2 { font-family: "Caveat Brush", "Nunito", system-ui, sans-serif; font-weight: 400; font-size: 24px;
       margin: 0 0 10px; color: var(--roxo); line-height: 1.1; }
  .linha { display: flex; gap: 8px; margin-bottom: 10px; }
  .linha > * { min-width: 0; }
  input { flex: 1; font: inherit; font-size: 18px; padding: 12px 14px; border: 1.5px solid var(--roxo-borda);
          border-radius: 12px; width: 100%; background: #fff; color: var(--txt); }
  input:focus { outline: none; border-color: var(--roxo); box-shadow: 0 0 0 3px rgba(73,6,75,.15); }
  label { display: block; font-size: 14px; font-weight: 700; color: var(--sub); margin: 10px 0 4px; }
  button.btn { font: inherit; font-size: 17px; font-weight: 700; padding: 12px 16px; border-radius: 12px;
               border: 1.5px solid var(--roxo-borda); background: #fff; color: var(--roxo); cursor: pointer;
               white-space: nowrap; transition: transform .05s, background .15s; }
  button.btn:active { transform: scale(.98); }
  button.pri { background: var(--roxo); color: #fff; border-color: var(--roxo); }
  button.pri:hover { background: var(--roxo-med); }
  button.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
  button.perigo { color: var(--erro); border-color: #efc2c8; background: #fff; }
  button.grande { width: 100%; padding: 18px; font-size: 19px; font-weight: 800; border-radius: 14px; }
  button:disabled { opacity: .45; cursor: default; }
  .produto-desc { font-size: 22px; font-weight: 800; margin-bottom: 4px; color: var(--roxo); }
  .produto-info { color: var(--sub); font-size: 15px; margin-bottom: 12px; }
  .saldo { font-weight: 800; color: var(--txt); }
  ul.lista { list-style: none; margin: 0; padding: 0; }
  ul.lista li { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px;
                padding: 12px 0; border-bottom: 1px dashed var(--roxo-borda); }
  ul.lista li:last-child { border-bottom: 0; }
  .item-txt { flex: 1 1 200px; min-width: 0; }
  .item-txt b { display: block; overflow-wrap: anywhere; font-weight: 800; }
  .item-txt small { color: var(--sub); }
  .item-acoes { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .item-acoes input { width: 90px; flex: none; font-size: 16px; padding: 8px; }
  .item-acoes button { padding: 8px 12px; font-size: 15px; }
  .pedido-cab { display: flex; justify-content: space-between; align-items: center; gap: 8px;
                flex-wrap: wrap; margin-bottom: 4px; padding-bottom: 8px; border-bottom: 2px solid var(--roxo-claro); }
  .pedido-cab b { font-family: "Caveat Brush", "Nunito", system-ui, sans-serif; font-weight: 400; font-size: 24px; color: var(--roxo); }
  .vazio { color: var(--sub); text-align: center; padding: 12px 0; }
  .aviso { color: var(--aviso); font-size: 15px; font-weight: 700; }
  .alerta-un { background: #fff4ce; color: #6b4a00; border-radius: 10px; padding: 8px 12px; font-size: 15px;
               font-weight: 700; margin-bottom: 10px; }
  .check { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 16px; color: var(--txt); }
  .check input { width: 22px; height: 22px; flex: none; accent-color: var(--roxo); }
  /* leitor */
  #scanner { position: fixed; inset: 0; background: var(--roxo-esc); z-index: 50; display: flex; flex-direction: column; }
  #scanner[hidden] { display: none; }
  #scanner video { flex: 1; width: 100%; object-fit: cover; min-height: 0; background: #000; }
  #mira { position: absolute; left: 10%; right: 10%; top: 40%; height: 20%;
          border: 3px solid #fff; border-radius: 16px; box-shadow: 0 0 0 9999px rgba(51,2,58,.45); pointer-events: none; }
  #scanner .rodape { padding: 16px; display: flex; flex-direction: column; gap: 8px; background: var(--roxo-esc); }
  #scanner .dica { color: #fff; text-align: center; font-family: "Caveat Brush", "Nunito", system-ui, sans-serif; font-size: 22px; }
  /* aviso flutuante */
  #toast { position: fixed; left: 16px; right: 16px; bottom: 16px; padding: 14px 16px; border-radius: 14px;
           color: #fff; background: var(--roxo); z-index: 60; font-size: 16px; font-weight: 700;
           box-shadow: 0 6px 20px rgba(51,2,58,.3); max-width: 688px; margin: 0 auto; }
  #toast.erro { background: var(--erro); }
  #toast[hidden] { display: none; }
  #carregando { position: fixed; inset: 0; background: rgba(250,246,250,.7); z-index: 55; display: flex;
                align-items: center; justify-content: center; font-family: "Caveat Brush", "Nunito", system-ui, sans-serif;
                font-size: 26px; color: var(--roxo); }
  #carregando[hidden] { display: none; }
</style>
</head>

      </button>
    </div>
  </section>

  <!-- ============ PENDENTES ============ -->
  <section id="aba-pendentes" hidden>
    <div class="linha"><button class="btn" id="pendAtualizar">↻ Atualizar</button></div>
    <div id="pendLista"></div>
  </section>

  <!-- ============ ENTRADA ============ -->
  <section id="aba-entrada" hidden>
    <div class="card">
      <button class="btn pri grande" id="entLer">📷 Ler código de barras</button>
      <div class="linha" style="margin-top:10px;margin-bottom:0">
        <input id="entCodigo" inputmode="numeric" placeholder="ou digite o código" autocomplete="off">
        <button class="btn" id="entBuscar">Buscar</button>
      </div>
    </div>

    <div class="card" id="entProduto" hidden>
      <div class="produto-desc" id="entDesc"></div>
      <div class="produto-info" id="entInfo"></div>
      <div class="alerta-un" id="entUn" hidden></div>
      <label for="entQtd">Quantidade de entrada</label>
      <input id="entQtd" inputmode="decimal" autocomplete="off">
      <label for="entObs">Observação (opcional)</label>
      <input id="entObs" autocomplete="off" placeholder="ex.: NF 1234">
      <button class="btn ok grande" id="entConfirmar" style="margin-top:12px">Dar entrada</button>
    </div>

    <div class="card" id="entCadastro" hidden>
      <h2>Produto não cadastrado — cadastrar</h2>
      <label for="cadBarras">Código de barras (EAN da embalagem; deixe vazio se não houver)</label>
      <input id="cadBarras" inputmode="numeric" autocomplete="off">
      <label for="cadCodigo">Código do produto</label>
      <input id="cadCodigo" autocomplete="off">
      <label for="cadDesc">Descrição</label>
      <input id="cadDesc" autocomplete="off">
      <label for="cadUn">Unidade (ex.: UN, KG, CX)</label>
      <input id="cadUn" autocomplete="off">
      <label for="cadQtd">Quantidade inicial (opcional)</label>
      <input id="cadQtd" inputmode="decimal" autocomplete="off">
      <label class="check"><input type="checkbox" id="cadConf"> Unidade de medida conferida</label>
      <button class="btn ok grande" id="cadConfirmar" style="margin-top:12px">Cadastrar produto</button>
    </div>
  </section>

  <!-- ============ CONFIG ============ -->
  <section id="aba-config" hidden>
    <div class="card">
      <h2>Conexão com a planilha</h2>
      <label for="cfgUrl">Endereço do app da Web (termina em /exec)</label>
      <input id="cfgUrl" autocomplete="off" placeholder="https://script.google.com/macros/s/.../exec">
      <label for="cfgChave">Chave de acesso</label>
      <input id="cfgChave" autocomplete="off">
      <button class="btn pri grande" id="cfgSalvar" style="margin-top:12px">Salvar e testar</button>
    </div>
  </section>
</main>

<!-- leitor de câmera (tela cheia) -->
<div id="scanner" hidden>
  <video id="video" playsinline muted></video>
  <div id="mira"></div>
  <div class="rodape">
    <div class="dica" id="scannerDica">Aponte para o código de barras</div>
    <button class="btn grande" id="scannerFechar">Cancelar</button>
  </div>
</div>

<div id="toast" hidden></div>
<div id="carregando" hidden>Só um instante…</div>

<script type="module">
// ======================================================= utilidades
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (v) => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isNaN(n) ? NaN : n; };
const fmt = (n) => Number(n).toLocaleString('pt-BR', { maximumFractionDigits: 3 });
const arred = (n) => Math.round(n * 1000) / 1000;

let toastTimer;
function toast(msg, erro = false) {
  const t = $('toast');
  t.textContent = msg;
  t.className = erro ? 'erro' : '';
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, erro ? 6000 : 3000);
}

function lerConfig() {
  try { return JSON.parse(localStorage.getItem('leitorCfg') || '{}'); } catch { return {}; }
}
function salvarConfig(cfg) {
  try { localStorage.setItem('leitorCfg', JSON.stringify(cfg)); } catch { /* sem armazenamento */ }
}

// ======================================================= comunicação com o Apps Script
async function api(acao, dados = {}) {
  const cfg = lerConfig();
  if (!cfg.url || !cfg.chave) throw new Error('Configure o endereço e a chave na aba Config.');
  $('carregando').hidden = false;
  try {
    // text/plain evita a "requisição de verificação" (preflight) que o Apps Script não responde
    const resp = await fetch(cfg.url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ acao, chave: cfg.chave, dados }),
      redirect: 'follow'
    });
    let j;
    try { j = await resp.json(); }
    catch { throw new Error('Resposta inesperada do servidor. Confira o endereço e se a implantação está como "Qualquer pessoa".'); }
    if (!j.ok) throw new Error(j.erro || 'Erro desconhecido.');
    if (j.produtos) atualizarCatalogo(j.produtos);
    return j;
  } catch (e) {
    if (e instanceof TypeError) throw new Error('Sem conexão com a planilha. Verifique a internet e o endereço.');
    throw e;
  } finally {
    $('carregando').hidden = true;
  }
}

// ======================================================= catálogo (cópia local para busca instantânea)
let catalogo = [];
const porCodigo = new Map();

function atualizarCatalogo(produtos) {
  catalogo = produtos;
  porCodigo.clear();
  for (const p of produtos) {
    if (p.codigo) porCodigo.set(p.codigo, p);
  }
  for (const p of produtos) {
    if (p.barras) porCodigo.set(p.barras, p); // código de barras tem prioridade
  }
}

function acharProduto(codigo) {
  return porCodigo.get(String(codigo).trim()) || null;
}

async function carregarCatalogo() {
  try {
    await api('catalogo');
    $('conexao').textContent = `conectado · ${catalogo.length} produtos`;
    return true;
  } catch (e) {
    $('conexao').textContent = 'não conectado';
    toast(e.message, true);
    return false;
  }
}

// ======================================================= leitor pela câmera
const FORMATOS = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf'];
let detector = null;
let stream = null;
let lendo = false;

async function obterDetector() {
  if (detector) return detector;
  let Classe = null;
  let formatos = FORMATOS;
  // 1º: leitor nativo do navegador (ex.: Chrome no Android), se ler EAN-13
  if ('BarcodeDetector' in window) {
    try {
      const sup = await window.BarcodeDetector.getSupportedFormats();
      if (sup.includes('ean_13')) {
        Classe = window.BarcodeDetector;
        formatos = FORMATOS.filter(f => sup.includes(f));
      }
    } catch { /* usa o alternativo */ }
  }
  // 2º: leitor alternativo (ZXing em WebAssembly), baixado na primeira vez
  if (!Classe) {
    const m = await import('https://fastly.jsdelivr.net/npm/barcode-detector@3/dist/es/ponyfill.min.js');
    Classe = m.BarcodeDetector;
  }
  detector = new Classe({ formats: formatos });
  return detector;
}

function bip() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.frequency.value = 1800;
    g.gain.value = 0.15;
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.12);
    o.onended = () => ctx.close();
  } catch { /* sem som */ }
  if (navigator.vibrate) navigator.vibrate(80);
}

async function abrirScanner(aoLer) {
  if (!navigator.mediaDevices?.getUserMedia) {
    toast('Este navegador não permite usar a câmera. Use o Chrome e um endereço https.', true);
    return;
  }
  $('scanner').hidden = false;
  $('scannerDica').textContent = 'Abrindo a câmera…';
  let det;
  try {
    det = await obterDetector();
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    const video = $('video');
    video.srcObject = stream;
    await video.play();
  } catch (e) {
    fecharScanner();
    const msg = e?.name === 'NotAllowedError'
      ? 'Permissão da câmera negada. Libere a câmera para este site nas configurações do navegador.'
      : 'Não foi possível abrir a câmera: ' + (e?.message || e);
    toast(msg, true);
    return;
  }
  $('scannerDica').textContent = 'Aponte para o código de barras';
  lendo = true;
  const video = $('video');
  const ciclo = async () => {
    if (!lendo) return;
    try {
      if (video.readyState >= 2) {
        const achados = await det.detect(video);
        if (achados.length && lendo) {
          const codigo = String(achados[0].rawValue).trim();
          bip();
          fecharScanner();
          aoLer(codigo);
          return;
        }
      }
    } catch { /* quadro ilegível; tenta o próximo */ }
    setTimeout(ciclo, 120);
  };
  ciclo();
}

function fecharScanner() {
  lendo = false;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  $('video').srcObject = null;
  $('scanner').hidden = true;
}
$('scannerFechar').onclick = fecharScanner;

// ======================================================= abas
function irPara(aba) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('ativo', b.dataset.aba === aba));
  document.querySelectorAll('main > section').forEach(s => { s.hidden = s.id !== 'aba-' + aba; });
  if (aba === 'pendentes') carregarPendentes();
}
document.querySelectorAll('nav button').forEach(b => { b.onclick = () => irPara(b.dataset.aba); });

// ======================================================= SAÍDA
let carrinho = [];        // [{ chave, codigo, descricao, unidade, quantidade }]
let produtoSaida = null;

const chaveDe = (p) => p.barras || p.codigo;
function qtdNoCarrinho(chave) {
  return carrinho.filter(i => i.chave === chave).reduce((s, i) => s + i.quantidade, 0);
}

function mostrarProdutoSaida(codigo) {
  const p = acharProduto(codigo);
  if (!p) {
    $('saidaProduto').hidden = true;
    produtoSaida = null;
    toast(`Código ${codigo} não cadastrado. Cadastre na aba Entrada.`, true);
    return;
  }
  produtoSaida = p;
  const livre = arred(p.disponivel - qtdNoCarrinho(chaveDe(p)));
  $('saidaDesc').textContent = p.descricao;
  $('saidaInfo').innerHTML = infoProduto(p) +
    `Disponível: <span class="saldo">${fmt(livre)} ${esc(p.unidade)}</span>`;
  $('saidaAviso').textContent = livre <= 0 ? 'Sem saldo disponível para este produto.' : '';
  avisoUnidade('saidaUn', p);
  $('saidaQtd').value = '';
  $('saidaProduto').hidden = false;
  $('saidaQtd').focus();
}

function infoProduto(p) {
  return [`Cód. ${p.codigo}`, p.barras && `EAN ${p.barras}`, p.unidade].filter(Boolean).map(esc).join(' · ') + '<br>';
}

function avisoUnidade(id, p) {
  $(id).hidden = !!p.conferida;
  $(id).textContent = p.conferida ? '' :
    `Atenção: a unidade (${p.unidade || 'não informada'}) deste produto ainda não foi conferida na planilha.`;
}

function buscarSaida() {
  const c = $('saidaCodigo').value.trim();
  if (!c) return;
  $('saidaCodigo').value = '';
  mostrarProdutoSaida(c);
}

$('saidaLer').onclick = () => abrirScanner(mostrarProdutoSaida);
$('saidaBuscar').onclick = buscarSaida;
$('saidaCodigo').addEventListener('keydown', e => { if (e.key === 'Enter') buscarSaida(); });
$('saidaQtd').addEventListener('keydown', e => { if (e.key === 'Enter') $('saidaAdicionar').click(); });

$('saidaAdicionar').onclick = () => {
  const p = produtoSaida;
  if (!p) return;
  const q = num($('saidaQtd').value);
  if (!(q > 0)) { toast('Digite uma quantidade maior que zero.', true); return; }
  const livre = arred(p.disponivel - qtdNoCarrinho(chaveDe(p)));
  if (q > livre + 1e-9) { toast(`Saldo insuficiente: disponível ${fmt(livre)} ${p.unidade}.`, true); return; }
  const existente = carrinho.find(i => i.chave === chaveDe(p));
  if (existente) existente.quantidade = arred(existente.quantidade + q);
  else carrinho.push({ chave: chaveDe(p), codigo: p.codigo, descricao: p.descricao, unidade: p.unidade, quantidade: arred(q) });
  $('saidaProduto').hidden = true;
  produtoSaida = null;
  renderCarrinho();
  toast(`${fmt(q)} ${p.unidade} de ${p.descricao} adicionado.`);
};

function renderCarrinho() {
  $('carrinho').innerHTML = carrinho.map((i, idx) => `
    <li>
      <div class="item-txt"><b>${esc(i.descricao)}</b><small>Cód. ${esc(i.codigo)}</small></div>
      <div class="item-acoes">
        <span><b>${fmt(i.quantidade)}</b> ${esc(i.unidade)}</span>
        <button class="btn perigo" data-remover="${idx}" aria-label="Remover">✕</button>
      </div>
    </li>`).join('');
  $('carrinhoVazio').hidden = carrinho.length > 0;
  $('enviarPedido').disabled = carrinho.length === 0;
  $('carrinho').querySelectorAll('[data-remover]').forEach(b => {
    b.onclick = () => { carrinho.splice(Number(b.dataset.remover), 1); renderCarrinho(); };
  });
}

$('enviarPedido').onclick = async () => {
  if (!carrinho.length) return;
  try {
    const r = await api('reservar', { itens: carrinho.map(i => ({ barras: i.chave, quantidade: i.quantidade })) });
    carrinho = [];
    renderCarrinho();
    toast(`Pedido ${r.pedido} criado. Estoque reservado.`);
    irPara('pendentes');
  } catch (e) { toast(e.message, true); }
};

// ======================================================= PENDENTES
async function carregarPendentes() {
  try {
    const r = await api('pendentes');
    renderPendentes(r.pendentes);
  } catch (e) {
    $('pendLista').innerHTML = `<div class="card vazio">${esc(e.message)}</div>`;
  }
}

function renderPendentes(itens) {
  if (!itens.length) {
    $('pendLista').innerHTML = '<div class="card vazio">Nenhum item aguardando liberação.</div>';
    return;
  }
  const grupos = {};
  itens.forEach(i => { (grupos[i.pedido] ||= []).push(i); });
  $('pendLista').innerHTML = Object.keys(grupos).sort().map(ped => {
    const lista = grupos[ped];
    const data = lista[0].data ? new Date(lista[0].data).toLocaleString('pt-BR') : '';
    return `
    <div class="card">
      <div class="pedido-cab">
        <div><b>${esc(ped)}</b> <small style="color:var(--sub)">${esc(data)}</small></div>
        <div class="item-acoes">
          <button class="btn ok" data-lib-pedido="${esc(ped)}">Liberar tudo</button>
          <button class="btn perigo" data-canc-pedido="${esc(ped)}">Cancelar tudo</button>
        </div>
      </div>
      <ul class="lista">${lista.map(i => `
        <li>
          <div class="item-txt">
            <b>${esc(i.descricao)}</b>
            <small>Cód. ${esc(i.codigo)} · pendente ${fmt(i.pendente)} ${esc(i.unidade)}` +
            `${i.liberada > 0 ? ` · já liberado ${fmt(i.liberada)}` : ''}</small>
          </div>
          <div class="item-acoes">
            <input inputmode="decimal" value="${fmt(i.pendente)}" data-qtd="${esc(i.id)}" aria-label="Quantidade">
            <button class="btn ok" data-lib-item="${esc(i.id)}">Liberar</button>
            <button class="btn perigo" data-canc-item="${esc(i.id)}">Cancelar</button>
          </div>
        </li>`).join('')}
      </ul>
    </div>`;
  }).join('');

  const qtdDe = (id) => num($('pendLista').querySelector(`[data-qtd="${CSS.escape(id)}"]`).value);
  const executar = async (acao, dados, msg) => {
    try {
      const r = await api(acao, dados);
      renderPendentes(r.pendentes);
      toast(msg);
    } catch (e) { toast(e.message, true); }
  };

  $('pendLista').querySelectorAll('[data-lib-item]').forEach(b => {
    b.onclick = () => {
      const q = qtdDe(b.dataset.libItem);
      if (!(q > 0)) { toast('Quantidade inválida.', true); return; }
      executar('liberar', { itens: [{ id: b.dataset.libItem, quantidade: q }] }, 'Saída registrada. Estoque baixado.');
    };
  });
  $('pendLista').querySelectorAll('[data-canc-item]').forEach(b => {
    b.onclick = () => {
      const q = qtdDe(b.dataset.cancItem);
      if (!(q > 0)) { toast('Quantidade inválida.', true); return; }
      if (!confirm(`Cancelar ${fmt(q)} deste item? O saldo volta para o disponível.`)) return;
      executar('cancelar', { itens: [{ id: b.dataset.cancItem, quantidade: q }] }, 'Cancelado. Saldo devolvido.');
    };
  });
  $('pendLista').querySelectorAll('[data-lib-pedido]').forEach(b => {
    b.onclick = () => {
      if (!confirm(`Liberar todos os itens pendentes do pedido ${b.dataset.libPedido}? As quantidades saem do estoque.`)) return;
      executar('liberar', { pedido: b.dataset.libPedido }, `Pedido ${b.dataset.libPedido} liberado. Estoque baixado.`);
    };
  });
  $('pendLista').querySelectorAll('[data-canc-pedido]').forEach(b => {
    b.onclick = () => {
      if (!confirm(`Cancelar todos os itens pendentes do pedido ${b.dataset.cancPedido}? O saldo volta para o disponível.`)) return;
      executar('cancelar', { pedido: b.dataset.cancPedido }, `Pedido ${b.dataset.cancPedido} cancelado.`);
    };
  });
}
$('pendAtualizar').onclick = carregarPendentes;

// ======================================================= ENTRADA
let produtoEntrada = null;

function mostrarProdutoEntrada(codigo) {
  const p = acharProduto(codigo);
  if (!p) {
    produtoEntrada = null;
    $('entProduto').hidden = true;
    $('entCadastro').hidden = false;
    ['cadBarras', 'cadCodigo', 'cadDesc', 'cadUn', 'cadQtd'].forEach(id => { $(id).value = ''; });
    $('cadConf').checked = false;
    $('cadBarras').value = codigo;
    $('cadCodigo').focus();
    return;
  }
  produtoEntrada = p;
  $('entCadastro').hidden = true;
  $('entDesc').textContent = p.descricao;
  $('entInfo').innerHTML = infoProduto(p) +
    `Disponível: <span class="saldo">${fmt(p.disponivel)} ${esc(p.unidade)}</span>`;
  avisoUnidade('entUn', p);
  $('entQtd').value = '';
  $('entObs').value = '';
  $('entProduto').hidden = false;
  $('entQtd').focus();
}

function buscarEntrada() {
  const c = $('entCodigo').value.trim();
  if (!c) return;
  $('entCodigo').value = '';
  mostrarProdutoEntrada(c);
}

$('entLer').onclick = () => abrirScanner(mostrarProdutoEntrada);
$('entBuscar').onclick = buscarEntrada;
$('entCodigo').addEventListener('keydown', e => { if (e.key === 'Enter') buscarEntrada(); });

$('entConfirmar').onclick = async () => {
  const p = produtoEntrada;
  if (!p) return;
  const q = num($('entQtd').value);
  if (!(q > 0)) { toast('Digite uma quantidade maior que zero.', true); return; }
  try {
    await api('entrada', { barras: chaveDe(p), quantidade: q, obs: $('entObs').value.trim() });
    $('entProduto').hidden = true;
    produtoEntrada = null;
    toast(`Entrada de ${fmt(q)} ${p.unidade} registrada.`);
  } catch (e) { toast(e.message, true); }
};

$('cadConfirmar').onclick = async () => {
  const dados = {
    barras: $('cadBarras').value.trim(),
    codigo: $('cadCodigo').value.trim(),
    descricao: $('cadDesc').value.trim(),
    unidade: $('cadUn').value.trim(),
    conferida: $('cadConf').checked,
    quantidade: $('cadQtd').value.trim() === '' ? 0 : num($('cadQtd').value)
  };
  if (!dados.codigo || !dados.descricao || !dados.unidade) {
    toast('Preencha código do produto, descrição e unidade.', true); return;
  }
  if (isNaN(dados.quantidade) || dados.quantidade < 0) { toast('Quantidade inicial inválida.', true); return; }
  try {
    await api('cadastrar', dados);
    $('entCadastro').hidden = true;
    toast(`Produto ${dados.descricao} cadastrado.`);
  } catch (e) { toast(e.message, true); }
};

// ======================================================= CONFIG
$('cfgSalvar').onclick = async () => {
  const cfg = { url: $('cfgUrl').value.trim(), chave: $('cfgChave').value.trim() };
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(cfg.url)) {
    toast('O endereço deve começar com https://script.google.com/ e terminar em /exec.', true); return;
  }
  if (!cfg.chave) { toast('Informe a chave de acesso.', true); return; }
  salvarConfig(cfg);
  if (await carregarCatalogo()) { toast('Conectado à planilha.'); irPara('saida'); }
};

// ======================================================= início
(async () => {
  const cfg = lerConfig();
  $('cfgUrl').value = cfg.url || '';
  $('cfgChave').value = cfg.chave || '';
  renderCarrinho();
  if (cfg.url && cfg.chave) await carregarCatalogo();
  else irPara('config');
})();
</script>
</body>
</html>
